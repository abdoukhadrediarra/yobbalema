name: Build

# Vérifie simplement que le site compile à chaque envoi — indépendant du déploiement
# (Cloudflare Pages / Netlify / Vercel font leur propre build au moment du déploiement).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
