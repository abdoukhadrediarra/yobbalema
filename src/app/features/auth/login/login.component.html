<app-auth-layout titre="Content de vous revoir" sousTitre="Connectez-vous pour retrouver vos trajets et vos courses.">
  <form (ngSubmit)="onSubmit()" #form="ngForm">
    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email"
             [(ngModel)]="email" placeholder="vous@exemple.com" />
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             [(ngModel)]="password" placeholder="••••••••" />
    </div>

    <p class="small" style="text-align:right;margin:-.4rem 0 .8rem"><a routerLink="/mot-de-passe-oublie" class="strong">Mot de passe oublié&nbsp;?</a></p>

    @if (errorMessage()) {
      <p class="field-error"><i class="bi bi-exclamation-circle"></i> {{ errorMessage() }}</p>
    }

    <button type="submit" class="btn btn--gold btn--block btn--lg" [disabled]="loading() || form.invalid">
      @if (loading()) {
        <span>Connexion…</span>
      } @else {
        <span><i class="bi bi-box-arrow-in-right"></i> Se connecter</span>
      }
    </button>
  </form>

  <p class="auth__switch">
    Pas encore de compte&nbsp;? <a routerLink="/inscription">Créer un compte</a>
  </p>
</app-auth-layout>
